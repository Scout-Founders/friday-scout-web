name: Scout Cloud Research Worker

on:
  workflow_dispatch:
    inputs:
      findings_limit:
        description: Recent completed runs to scan for findings
        required: false
        default: "20"
      skip_findings:
        description: Run research jobs only (skip findings generation)
        required: false
        type: boolean
        default: false
      use_snapshot_artifact:
        description: Import scout-research-snapshot artifact before running research
        required: false
        type: boolean
        default: false
      snapshot_artifact_run_id:
        description: Run ID containing scout-research-snapshot (defaults to current run)
        required: false
        default: ""
      use_daily_reports_artifact:
        description: Import scout-daily-reports artifact before running research
        required: false
        type: boolean
        default: false
      daily_reports_artifact_run_id:
        description: Run ID containing scout-daily-reports (defaults to current run)
        required: false
        default: ""
  schedule:
    # Weekday mornings at 14:00 UTC (~6 AM US Pacific during standard time).
    - cron: "0 14 * * 1-5"
  workflow_run:
    workflows:
      - Scout Daily Reports Publish
    types:
      - completed

permissions:
  contents: read
  actions: read

concurrency:
  group: scout-cloud-research-worker
  cancel-in-progress: false

jobs:
  research-worker:
    name: Run scheduled research and findings
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      SCOUT_RESEARCH_WORKER_SECRET: ${{ secrets.SCOUT_RESEARCH_WORKER_SECRET }}
      SCOUT_CLOUD_RESEARCH_ENABLED: ${{ secrets.SCOUT_CLOUD_RESEARCH_ENABLED }}
      SCOUT_RESEARCH_DB_PATH: scout-gates-sandbox/scout_research_cloud.db
      SNAPSHOT_BUNDLE_DIR: scout-gates-sandbox/snapshot-bundle
      DAILY_REPORTS_BUNDLE_DIR: scout-gates-sandbox/daily-reports-bundle
      # When chained from Scout Daily Reports Publish, import that run's artifact.
      USE_DAILY_REPORTS_ARTIFACT: ${{ github.event_name == 'workflow_run' && 'true' || (inputs.use_daily_reports_artifact == true && 'true' || 'false') }}
      DAILY_REPORTS_ARTIFACT_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.daily_reports_artifact_run_id || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore Scout cloud research database cache
        uses: actions/cache@v4
        id: scout-memory-cache
        with:
          path: scout-gates-sandbox/scout_research_cloud.db
          key: scout-research-cloud-db-v1-${{ github.repository }}-${{ github.ref_name }}
          restore-keys: |
            scout-research-cloud-db-v1-${{ github.repository }}-

      - name: Download research snapshot artifact from current run
        if: inputs.use_snapshot_artifact == true && inputs.snapshot_artifact_run_id == ''
        uses: actions/download-artifact@v4
        with:
          name: scout-research-snapshot
          path: ${{ env.SNAPSHOT_BUNDLE_DIR }}

      - name: Download research snapshot artifact from run id
        if: inputs.use_snapshot_artifact == true && inputs.snapshot_artifact_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: scout-research-snapshot
          path: ${{ env.SNAPSHOT_BUNDLE_DIR }}
          run-id: ${{ inputs.snapshot_artifact_run_id }}

      - name: Import research snapshot into cloud DB
        if: inputs.use_snapshot_artifact == true
        run: |
          set -euo pipefail
          python3 scout-gates-sandbox/cloud_research_snapshot_workflow.py validate-bundle \
            --bundle-dir "${SNAPSHOT_BUNDLE_DIR}"
          python3 scout-gates-sandbox/import_research_snapshot.py \
            --snapshot "${SNAPSHOT_BUNDLE_DIR}/research_snapshot.db" \
            --manifest "$(python3 scout-gates-sandbox/cloud_research_snapshot_workflow.py manifest-path --bundle-dir "${SNAPSHOT_BUNDLE_DIR}")" \
            --target "${SCOUT_RESEARCH_DB_PATH}"

      - name: Download scout daily reports artifact from current run
        id: download-daily-reports-current
        if: env.USE_DAILY_REPORTS_ARTIFACT == 'true' && github.event_name != 'workflow_run' && env.DAILY_REPORTS_ARTIFACT_RUN_ID == ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: scout-daily-reports
          path: ${{ env.DAILY_REPORTS_BUNDLE_DIR }}

      # Cross-workflow download requires github-token; without it, run-id is ignored and
      # download-artifact only searches the current (worker) run.
      - name: Download scout daily reports artifact from upstream publisher run
        id: download-daily-reports-workflow-run
        if: github.event_name == 'workflow_run' && env.USE_DAILY_REPORTS_ARTIFACT == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: scout-daily-reports
          path: ${{ env.DAILY_REPORTS_BUNDLE_DIR }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download scout daily reports artifact from run id
        id: download-daily-reports-run-id
        if: github.event_name != 'workflow_run' && env.USE_DAILY_REPORTS_ARTIFACT == 'true' && env.DAILY_REPORTS_ARTIFACT_RUN_ID != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: scout-daily-reports
          path: ${{ env.DAILY_REPORTS_BUNDLE_DIR }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.DAILY_REPORTS_ARTIFACT_RUN_ID }}

      - name: Import scout daily reports bundle into cloud DB
        if: env.USE_DAILY_REPORTS_ARTIFACT == 'true' && (steps.download-daily-reports-current.outcome == 'success' || steps.download-daily-reports-workflow-run.outcome == 'success' || steps.download-daily-reports-run-id.outcome == 'success')
        run: |
          set -euo pipefail
          python3 scout-gates-sandbox/cloud_research_daily_reports_workflow.py validate-bundle \
            --bundle-dir "${DAILY_REPORTS_BUNDLE_DIR}"
          python3 scout-gates-sandbox/ingest_scout_reports.py \
            --from-bundle-dir "${DAILY_REPORTS_BUNDLE_DIR}"

      - name: Run scheduled research worker
        run: |
          set -euo pipefail
          ARGS=(scout-gates-sandbox/scheduled_research_runner.py --cloud-worker --skip-report-ingest)
          if [ "${{ github.event_name == 'workflow_run' && 'false' || inputs.skip_findings }}" = "true" ]; then
            ARGS+=(--skip-findings)
          fi
          FINDINGS_LIMIT="${{ github.event_name == 'workflow_run' && '20' || inputs.findings_limit }}"
          if [ -n "${FINDINGS_LIMIT}" ]; then
            ARGS+=(--findings-limit "${FINDINGS_LIMIT}")
          fi
          python3 "${ARGS[@]}"

      - name: Upload Scout cloud research database artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scout-research-cloud-db-${{ github.run_id }}
          path: scout-gates-sandbox/scout_research_cloud.db
          if-no-files-found: ignore
          retention-days: 14
